<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>WatchTogether - Profiles</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        /* --- STİLLER (Profil için güncellendi) --- */
        body { margin: 0; overflow: hidden; background: #050505; color: #e5e5e5; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; height: 100vh; user-select: none; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.5; pointer-events: none; }
        
        .main-content { flex: 1; position: relative; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; }
        .top-bar { background: rgba(30, 30, 30, 0.6); backdrop-filter: blur(10px); padding: 15px 25px; margin: 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255, 255, 255, 0.1); }
        #admin-panel { display: none; background: rgba(44, 44, 44, 0.9); border-left: 4px solid #46d369; padding: 20px; margin: 0 20px 20px 20px; border-radius: 12px; }
        #player-wrapper { position: relative; width: calc(100% - 40px); margin: 0 auto; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        #player-container { width: 100%; height: 100%; }
        #blocker { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; cursor: default; }
        #placeholder-text { position: absolute; top:50%; left:50%; transform:translate(-50%,-50%); color: #888; font-size: 20px; pointer-events: none; letter-spacing: 2px; }
        .custom-controls { background: rgba(31, 31, 31, 0.8); margin: 10px 20px; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-radius: 12px; }

        .sidebar { width: 350px; background: #111; border-left: 1px solid #333; display: flex; flex-direction: column; z-index: 20; }
        .sidebar-header { padding: 20px; background: #1a1a1a; border-bottom: 1px solid #333; display: flex; gap: 10px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: #222; color: #888; cursor: pointer; border-radius: 6px; font-weight: bold; }
        .tab-btn.active { background: #46d369; color: #000; }
        
        #chat-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        /* CHAT MESAJ STİLİ (Avatar için düzenlendi) */
        .msg { font-size: 14px; padding: 8px 12px; border-radius: 8px; background: #222; max-width: 90%; word-wrap: break-word; margin-bottom: 8px; display: flex; align-items: flex-start; gap: 10px; }
        .msg-avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; border: 1px solid #444; }
        .msg-content { display: flex; flex-direction: column; }
        .msg.system { background: transparent; color: #888; font-size: 12px; text-align: center; border: 1px solid #333; align-self: center; display: block; }
        .msg.warn { color: #e50914; border: 1px solid #e50914; background: rgba(229, 9, 20, 0.1); }
        .msg b { color: #46d369; font-size: 12px; }

        .chat-input-area { padding: 15px; background: #1a1a1a; border-top: 1px solid #333; display: flex; gap: 10px; }
        #chatInput { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #000; color: white; outline: none; }
        
        #users-panel { flex: 1; display: none; overflow-y: auto; padding: 15px; }
        .user-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; margin-bottom: 8px; background: #222; border-radius: 8px; transition: 0.2s;}
        .user-item:hover { background: #2a2a2a; }
        .user-info { display: flex; align-items: center; gap: 12px; font-size: 14px; }
        .list-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #46d369; }
        .admin-controls { display: none; gap: 5px; }
        .btn-mini { padding: 4px 8px; font-size: 11px; cursor: pointer; border-radius: 4px; border: none; color: white; }
        .btn-ban { background: #e50914; }
        .btn-mute { background: #f39c12; }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.96); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .hidden { display: none !important; }
        
        .login-box { background: #151515; padding: 40px; border-radius: 12px; border: 1px solid #333; text-align: center; width: 300px; box-shadow: 0 20px 50px rgba(0,0,0,0.7); }
        .name-input { padding: 12px; font-size: 14px; border-radius: 6px; border: 1px solid #444; background: #222; color: white; width: 100%; box-sizing: border-box; margin-bottom: 10px; outline: none; transition: 0.3s;}
        .name-input:focus { border-color: #46d369; }
        .btn-action { padding: 12px 20px; cursor: pointer; border-radius: 6px; border: none; background: linear-gradient(135deg, #46d369 0%, #2ea04b 100%); color: white; font-weight: bold; width: 100%; margin-top: 10px;}
        
        .admin-key-btn { background: transparent; border: 1px solid #444; color: #666; padding: 5px 10px; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        .admin-key-btn:hover { color: #46d369; border-color: #46d369; }

        #admin-popup-card { background: #151515; padding: 30px; border-radius: 12px; border: 1px solid #333; text-align: center; position: relative; width: 250px; }
        .close-btn { position: absolute; top: 10px; right: 15px; color: #888; cursor: pointer; font-size: 20px; }
        #mute-lock-indicator { display: none; color: #e50914; font-weight: bold; font-size: 12px; margin-left: 10px; }
        
        @media (max-width: 768px) { body { flex-direction: column; overflow: auto; user-select: auto;} .sidebar { width: 100%; height: 400px; } }
    </style>
</head>
<body>

    <div id="login-overlay" class="overlay">
        <div class="login-box">
            <h2 style="color: #46d369; margin-top:0;">PROFİL OLUŞTUR</h2>
            <div id="avatar-preview" style="margin-bottom: 20px;">
                <img id="preview-img" src="https://www.gravatar.com/avatar/00000000000000000000000000000000?d=mp&f=y" style="width: 80px; height: 80px; border-radius: 50%; border: 2px solid #333;">
            </div>
            <input type="text" id="usernameInput" class="name-input" placeholder="Kullanıcı Adın" maxlength="15">
            <input type="email" id="emailInput" class="name-input" placeholder="E-Posta (Avatar için)" oninput="updateAvatarPreview()">
            <small style="color: #666; display:block; margin-bottom:10px; font-size: 11px;">E-posta girersen foton otomatik gelir.</small>
            <button class="btn-action" onclick="submitProfile()">Odaya Gir</button>
        </div>
    </div>

    <div id="admin-popup" class="overlay hidden">
        <div id="admin-popup-card">
            <div class="close-btn" onclick="toggleAdminPopup()">×</div>
            <h3 style="color: #46d369;">YÖNETİCİ</h3>
            <input type="password" id="passInput" class="name-input" placeholder="Şifre">
            <button class="btn-action" onclick="girisYap()">Doğrula</button>
            <p id="login-msg" style="color: #e50914; font-size: 12px; margin-top: 10px;"></p>
        </div>
    </div>

    <div id="canvas-container"></div>

    <div class="main-content">
        <div class="top-bar">
            <div id="my-name-display" style="display:flex; align-items:center; gap:10px;">
                <img id="my-mini-avatar" src="" style="width:30px; height:30px; border-radius:50%; display:none;">
                <span>Misafir</span>
            </div>
            <div style="display: flex; align-items: center; gap: 15px;">
                <div id="status-text" style="color: #aaa; font-size: 14px;">İzleyici</div>
                <button class="admin-key-btn" onclick="toggleAdminPopup()" title="Yönetici Girişi">
                    <i class="fa-solid fa-key"></i>
                </button>
            </div>
        </div>

        <div id="admin-panel">
            <h3 style="margin-top: 0; color: #46d369;">Yönetici Paneli</h3>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="videoLink" class="name-input" style="width: 100%; margin:0;" placeholder="YouTube URL (Örn: v=dQw4w9WgXcQ)">
                <button class="btn-action" onclick="videoDegistir()">YAYINLA</button>
            </div>
        </div>

        <div id="player-wrapper">
            <div id="placeholder-text">BAĞLANTI BEKLENİYOR...</div>
            <div id="blocker"></div>
            <div id="player"></div>
        </div>

        <div class="custom-controls">
            <div style="display:flex; align-items:center; gap:15px;">
                <button onclick="toggleMute()" style="background:none; border:none; color:white; font-size:18px; cursor:pointer;"><i id="mute-icon" class="fa-solid fa-volume-high"></i></button>
                <input type="range" id="vol-slider" min="0" max="100" value="100" oninput="setVolume(this.value)">
                <span id="mute-lock-indicator"><i class="fa-solid fa-lock"></i> SUS</span>
            </div>
            <div style="display:flex; align-items:center; gap:15px;">
                <button onclick="syncNow()" class="btn-action" style="padding: 5px 15px; font-size:12px;"><i class="fa-solid fa-rotate"></i> Senkron</button>
                <button onclick="toggleFullScreen()" style="background:none; border:none; color:white; font-size:18px; cursor:pointer;"><i class="fa-solid fa-expand"></i></button>
            </div>
        </div>
    </div>

    <div class="sidebar">
        <div class="sidebar-header">
            <button class="tab-btn active" onclick="switchTab('chat')">Chat</button>
            <button class="tab-btn" onclick="switchTab('users')">Kişiler</button>
        </div>

        <div id="chat-panel">
            <div id="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="..." maxlength="200" onkeypress="if(event.key==='Enter') sendMessage()">
                <button class="btn-action" style="padding: 0 15px;" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>

        <div id="users-panel">
            <div id="user-list-container"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Three.js Arka Plan
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const renderer = new THREE.WebGLRenderer({ alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);
        const material = new THREE.ShaderMaterial({
            uniforms: { u_time: { value: 0.0 } },
            vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
            fragmentShader: `uniform float u_time; varying vec2 vUv; float rand(vec2 st) { return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123); } void main() { vec3 c = vec3(0.02, 0.05, 0.03); float n = rand(vUv * 10.0 + u_time * 0.1); gl_FragColor = vec4(c + n * 0.05, 1.0); }`
        });
        scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));
        function animate() { material.uniforms.u_time.value += 0.05; renderer.render(scene, camera); requestAnimationFrame(animate); } animate();
        window.addEventListener('resize', () => { renderer.setSize(window.innerWidth, window.innerHeight); });

        // --- MANTIK KODLARI ---
        const socket = io();
        let player, isAdmin = false, isRemote = false, forcedMute = false, pendingSyncData = null;
        let myAvatarUrl = "https://www.gravatar.com/avatar/00000000000000000000000000000000?d=mp&f=y";

        // 1. SİTE AÇILINCA: LocalStorage Kontrolü
        window.onload = () => {
            const savedName = localStorage.getItem('wt_username');
            const savedEmail = localStorage.getItem('wt_email');
            
            if (savedName) {
                document.getElementById('usernameInput').value = savedName;
                if(savedEmail) {
                    document.getElementById('emailInput').value = savedEmail;
                    updateAvatarPreview(); // Avatarı hesapla
                }
                // Otomatik giriş yapabiliriz ama isim değiştirmek isterler diye bekletiyoruz
            }
        }

        // 2. AVATAR OLUŞTURMA (MD5)
        function updateAvatarPreview() {
            const email = document.getElementById('emailInput').value.trim().toLowerCase();
            if (email) {
                const hash = CryptoJS.MD5(email).toString();
                // d=robohash: Foto yoksa robot çıkar
                myAvatarUrl = `https://www.gravatar.com/avatar/${hash}?d=robohash`;
            } else {
                myAvatarUrl = "https://www.gravatar.com/avatar/00000000000000000000000000000000?d=mp&f=y";
            }
            document.getElementById('preview-img').src = myAvatarUrl;
        }

        function submitProfile() {
            const name = document.getElementById('usernameInput').value.trim();
            const email = document.getElementById('emailInput').value.trim();
            
            if(!name) return alert("Bir isim girmelisin!");

            // Hafızaya kaydet
            localStorage.setItem('wt_username', name);
            if(email) localStorage.setItem('wt_email', email);

            // Sunucuya gönder
            socket.emit('set_user_data', { name: name, avatar: myAvatarUrl });

            document.getElementById('login-overlay').classList.add('hidden');
            
            // Sol üstteki profil
            const disp = document.getElementById('my-name-display');
            disp.innerHTML = `<img src="${myAvatarUrl}" style="width:30px; height:30px; border-radius:50%; border:1px solid #46d369;"> <span>${name.substring(0,15)}</span>`;
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`button[onclick="switchTab('${tab}')"]`).classList.add('active');
            document.getElementById('chat-panel').style.display = tab === 'chat' ? 'flex' : 'none';
            document.getElementById('users-panel').style.display = tab === 'users' ? 'block' : 'none';
        }

        function sendMessage() {
            const inp = document.getElementById('chatInput');
            if(inp.value.trim()) { socket.emit('send_message', inp.value); inp.value = ''; }
        }

        socket.on('chat_history', (history) => {
            const box = document.getElementById('chat-messages');
            box.innerHTML = '';
            history.forEach(data => appendMessage(data));
        });

        socket.on('chat_message', (data) => appendMessage(data));

        function appendMessage(data) {
            const box = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = `msg ${data.type}`;
            
            if(data.type === 'system') {
                div.innerText = data.text;
            } else { 
                // Mesajda avatar göster
                const avatarImg = data.avatar || "https://www.gravatar.com/avatar/?d=mp";
                div.innerHTML = `
                    <img class="msg-avatar" src="${avatarImg}">
                    <div class="msg-content">
                        <b>${data.user}</b>
                        <span>${data.text}</span>
                    </div>
                `; 
            }
            box.appendChild(div); 
            box.scrollTop = box.scrollHeight;
        }

        socket.on('update_user_list', (users) => {
            const container = document.getElementById('user-list-container');
            container.innerHTML = '';
            Object.keys(users).forEach(id => {
                const u = users[id];
                const div = document.createElement('div');
                div.className = 'user-item';
                
                let buttons = '';
                if(isAdmin && id !== socket.id) {
                    buttons = `<div class="admin-controls" style="display:flex"><button class="btn-mini btn-mute" onclick="adminAction('${id}', 'mute')">${u.muted ? 'Unmute' : 'Mute'}</button><button class="btn-mini btn-ban" onclick="adminAction('${id}', 'ban')">Ban</button></div>`;
                }
                
                // Listede avatar göster
                const avatarImg = u.avatar || "https://www.gravatar.com/avatar/?d=mp";
                
                div.innerHTML = `
                    <div class="user-info">
                        <img class="list-avatar" src="${avatarImg}">
                        <span>${u.name}</span>
                        ${u.muted ? '<i class="fa-solid fa-microphone-slash" style="color:#f39c12"></i>' : ''}
                    </div>
                    ${buttons}
                `;
                container.appendChild(div);
            });
        });

        // --- ADMIN & DİĞERLERİ (AYNI) ---
        function toggleAdminPopup() {
            const popup = document.getElementById('admin-popup');
            if(popup.classList.contains('hidden')) popup.classList.remove('hidden');
            else popup.classList.add('hidden');
            document.getElementById('login-msg').innerText = "";
            document.getElementById('passInput').value = "";
        }

        function girisYap() {
            const pwd = document.getElementById('passInput').value;
            if(pwd.length > 0) { 
                document.getElementById('login-msg').innerText = "Kontrol ediliyor..."; 
                socket.emit('admin_girisi', pwd); 
            }
        }

        socket.on('admin_error', (msg) => { document.getElementById('login-msg').innerText = msg; });
        socket.on('admin_basarili', (success) => { if(success) { isAdmin = true; toggleAdminPopup(); document.getElementById('admin-panel').style.display = 'block'; document.getElementById('blocker').style.display = 'none'; document.getElementById('status-text').innerText = "YÖNETİCİ"; document.getElementById('status-text').style.color = "#46d369"; document.querySelector('.admin-key-btn').style.display = 'none'; } });
        function adminAction(targetId, action) { socket.emit('admin_action', { targetId, action }); }
        socket.on('force_disconnect', (reason) => { document.body.innerHTML = `<div style="display:flex;height:100vh;align-items:center;justify-content:center;color:red;font-size:24px;text-align:center;background:black;">🚫<br>${reason}</div>`; });
        socket.on('toggle_mute_lock', (isMuted) => { forcedMute = isMuted; const lockIcon = document.getElementById('mute-lock-indicator'); if(forcedMute) { player.mute(); player.setVolume(0); document.getElementById('vol-slider').value = 0; document.getElementById('vol-slider').disabled = true; lockIcon.style.display = 'inline'; } else { player.unMute(); player.setVolume(100); document.getElementById('vol-slider').disabled = false; lockIcon.style.display = 'none'; } });

        var tag = document.createElement('script'); tag.src = "https://www.youtube.com/iframe_api"; var firstScriptTag = document.getElementsByTagName('script')[0]; firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
        function onYouTubeIframeAPIReady() { player = new YT.Player('player', { height: '100%', width: '100%', playerVars: { 'controls': 1, 'disablekb': 1, 'rel': 0, 'modestbranding': 1, 'iv_load_policy': 3, 'playsinline': 1 }, events: { 'onStateChange': onPlayerStateChange, 'onReady': onPlayerReady } }); }
        function onPlayerReady() { player.mute(); document.getElementById('vol-slider').value = 0; updateMuteIcon(0); if (pendingSyncData) { applySync(pendingSyncData); pendingSyncData = null; } }
        function videoDegistir() { let url = document.getElementById('videoLink').value; let vId = (url.match(/^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#&?]*).*/)||[])[7]; if(vId && vId.length==11) { document.getElementById('placeholder-text').style.display='none'; player.loadVideoById(vId); socket.emit('video_action', {type:'change', videoId:vId}); } }
        function onPlayerStateChange(event) { if(event.data === YT.PlayerState.PLAYING) document.getElementById('placeholder-text').style.display='none'; if(isRemote || !isAdmin) return; if(event.data === YT.PlayerState.PLAYING) socket.emit('video_action', {type:'play', time:player.getCurrentTime()}); else if(event.data === YT.PlayerState.PAUSED) socket.emit('video_action', {type:'pause', time:player.getCurrentTime()}); }
        function applySync(data) { isRemote = true; document.getElementById('placeholder-text').style.display='none'; if(data.videoId && (!player.getVideoData() || player.getVideoData().video_id !== data.videoId)) { player.loadVideoById(data.videoId, data.time); } if(data.type==='play') { let diff = Math.abs(player.getCurrentTime() - data.time); if(diff > 1) player.seekTo(data.time, true); player.playVideo(); } else if(data.type==='pause') { player.seekTo(data.time, true); player.pauseVideo(); } else if(data.type==='change') { player.loadVideoById(data.videoId); } setTimeout(()=>isRemote=false, 1000); }
        socket.on('sync_video', (data) => { if (!player || !player.loadVideoById) { pendingSyncData = data; } else { applySync(data); } });
        function toggleMute() { if(forcedMute) return alert("Yönetici tarafından susturuldunuz!"); if(player.isMuted()) { player.unMute(); document.getElementById('vol-slider').value = player.getVolume(); updateMuteIcon(player.getVolume()); } else { player.mute(); document.getElementById('vol-slider').value = 0; updateMuteIcon(0); } }
        function updateMuteIcon(vol) { const icon = document.getElementById('mute-icon'); if(vol == 0) icon.className = "fa-solid fa-volume-xmark"; else if(vol < 50) icon.className = "fa-solid fa-volume-low"; else icon.className = "fa-solid fa-volume-high"; }
        function setVolume(v) { if(!forcedMute) { player.setVolume(v); updateMuteIcon(v); } }
        function syncNow() { location.reload(); }
        function toggleFullScreen() { var e = document.getElementById("player-wrapper"); if(!document.fullscreenElement) e.requestFullscreen().catch(()=>{}); else document.exitFullscreen(); }
    </script>
</body>
</html>
